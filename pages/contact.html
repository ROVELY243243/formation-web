<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Formation Web</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>

<header class="header">

    <div class="container nav-container">

        <a href="../index.html"
           class="logo">

            <span class="logo-icon">
                W
            </span>

            <span>
                Formation<span class="logo-highlight">
                    Web
                </span>
            </span>

        </a>


        <button class="menu-toggle"
                id="menuToggle">

            ☰

        </button>


        <nav class="navbar"
             id="navbar">

            <a href="../index.html">
                Accueil
            </a>

            <a href="formations.html">
                Formations
            </a>

            <a href="cours.html">
                Cours
            </a>

            <a href="apropos.html">
                À propos
            </a>

            <a href="contact.html"
               class="active">

                Contact

            </a>

            <button
                id="themeToggle"
                class="theme-button">

                🌙

            </button>

        </nav>

    </div>

</header>


<main>

<section class="section">

    <div class="container">

        <div class="section-heading">

            <span class="section-label">
                CONTACT
            </span>

            <h1>
                Contacte-nous
            </h1>

            <p>
                Une question sur une formation ?
                Écris-nous.
            </p>

        </div>


        <form class="contact-form"
              id="contactForm">

            <div class="feature">

                <div>

                    <label for="name">
                        Nom complet
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Votre nom"
                        required
                    >

                </div>

            </div>


            <div class="feature">

                <div>

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="votre@email.com"
                        required
                    >

                </div>

            </div>


            <div class="feature">

                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Votre message..."
                        required
                    ></textarea>

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Envoyer le message

            </button>


            <p id="formMessage"></p>

        </form>

    </div>

</section>

</main>


<footer class="footer">

    <div class="footer-bottom">

        <div class="container">

            <p>
                © <span id="currentYear"></span>
                Formation Web.
            </p>

        </div>

    </div>

</footer>


<script src="../js/script.js"></script>
<script src="../js/menu.js"></script>

</body>

</html>
